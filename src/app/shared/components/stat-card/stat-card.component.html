<div class="stat-card" [class]="variant">
  <div class="stat-header">
    <span class="stat-icon">{{ icon }}</span>
    <span *ngIf="badge" class="stat-badge">{{ badge }}</span>
  </div>
  <div class="stat-body">
    <span class="stat-value">{{ value }}</span>
    <span class="stat-title">{{ title }}</span>
  </div>
</div>
