<header class="main-header">
  <div class="header-left">
    <div class="search-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" class="search-input" placeholder="Recherche globale (produit, commande, tiers...)" />
    </div>
  </div>

  <div class="header-right">
    <!-- Notification Bell -->
    <div class="notification-bell">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span class="notification-badge">3</span>
    </div>

    <!-- User Profile with Role Selection -->
    <div class="user-profile" (click)="logout()" title="Cliquer pour se déconnecter">
      <div class="user-avatar">{{ getInitials() }}</div>
      <div class="user-info">
        <span class="user-name">{{ user()?.firstName ? (user()?.firstName + ' ' + user()?.lastName) : (user()?.email || 'Mael Koutoglo') }}</span>
        <span class="user-role-badge">{{ user()?.roleName || user()?.role?.name || user()?.role || 'SUPER_ADMIN' }}</span>
      </div>
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 4px; opacity: 0.6;"><path d="m6 9 6 6 6-6"/></svg>
    </div>
  </div>
</header>
