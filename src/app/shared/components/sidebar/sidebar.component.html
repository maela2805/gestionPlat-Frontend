<aside class="sidebar-container">
  <div class="sidebar-brand">
    <div class="brand-logo">🍳</div>
    <div class="brand-text">
      <h2>KIKI TRAITEUR</h2>
      <span class="brand-sub">Gestion Plat & Stock</span>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
      <span class="nav-icon">📊</span>
      <span class="nav-label">Tableau de bord</span>
    </a>

    <a routerLink="/products" routerLinkActive="active" class="nav-item">
      <span class="nav-icon">🍲</span>
      <span class="nav-label">Produits & Plats</span>
    </a>

    <a routerLink="/categories" routerLinkActive="active" class="nav-item">
      <span class="nav-icon">📁</span>
      <span class="nav-label">Catégories</span>
    </a>

    <a routerLink="/stock" routerLinkActive="active" class="nav-item">
      <span class="nav-icon">📦</span>
      <span class="nav-label">Mouvements Stock</span>
    </a>

    <a routerLink="/profile" routerLinkActive="active" class="nav-item">
      <span class="nav-icon">👤</span>
      <span class="nav-label">Mon Profil</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="user-pill" *ngIf="user()">
      <div class="avatar">{{ getInitials() }}</div>
      <div class="user-info">
        <span class="user-name">{{ user()?.firstName || user()?.email }}</span>
        <span class="user-role">{{ user()?.role?.name || 'ADMIN' }}</span>
      </div>
    </div>

    <button class="btn-logout" (click)="logout()" title="Se déconnecter">
      🚪 <span>Déconnexion</span>
    </button>
  </div>
</aside>
