<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo">GE</div>
      <h1>Inscription</h1>
      <p>Créer votre compte GESTEN</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">Prénom</label>
          <input id="firstName" type="text" formControlName="firstName" placeholder="Jean" />
        </div>

        <div class="form-group">
          <label for="lastName">Nom</label>
          <input id="lastName" type="text" formControlName="lastName" placeholder="Dupont" />
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input 
          id="email" 
          type="email" 
          formControlName="email" 
          placeholder="votre.email@exemple.com"
        />
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input 
          id="password" 
          type="password" 
          formControlName="password" 
          placeholder="••••••••"
        />
      </div>

      <div *ngIf="errorMessage()" class="alert-error">
        ⚠️ {{ errorMessage() }}
      </div>

      <button type="submit" class="btn-submit" [disabled]="isLoading() || registerForm.invalid">
        <span *ngIf="!isLoading()">Créer mon compte</span>
        <span *ngIf="isLoading()">Inscription en cours...</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Déjà un compte ? <a routerLink="/login">Se connecter</a></p>
    </div>
  </div>
</div>
