<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo">GE</div>
      <h1>GESTEN</h1>
      <p>Plateforme de Gestion d'Entreprise Intégrée</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          id="email" 
          type="email" 
          formControlName="email" 
          placeholder="votre.email@exemple.com"
          [class.invalid]="isFieldInvalid('email')"
        />
        <span *ngIf="isFieldInvalid('email')" class="field-error">Adresse email valide requise</span>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input 
          id="password" 
          type="password" 
          formControlName="password" 
          placeholder="••••••••"
          [class.invalid]="isFieldInvalid('password')"
        />
        <span *ngIf="isFieldInvalid('password')" class="field-error">Mot de passe requis</span>
      </div>

      <div *ngIf="successMessage()" class="alert-success" style="background: rgba(82, 196, 26, 0.15); border: 1px solid #52c41a; color: #52c41a; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 0.85rem;">
        ✅ {{ successMessage() }}
      </div>

      <div *ngIf="errorMessage()" class="alert-error">
        ⚠️ {{ errorMessage() }}
      </div>

      <div *ngIf="isSlowLoading()" class="alert-info" style="background: rgba(24, 144, 255, 0.12); border: 1px solid #1890ff; color: #1890ff; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 0.85rem; display: flex; align-items: center; gap: 8px;">
        <span>⏳</span>
        <span>Le serveur est en train de démarrer (sortie de veille Render). Veuillez patienter quelques secondes...</span>
      </div>

      <button type="submit" class="btn-submit" [disabled]="isLoading() || loginForm.invalid">
        <span *ngIf="!isLoading()">Se connecter</span>
        <span *ngIf="isLoading()">Connexion en cours...</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Pas encore de compte ? <a routerLink="/register">Créer un compte</a></p>
    </div>
  </div>
</div>
